name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore per-app audio helper
        run: nuget restore native/ApplicationLoopback/ApplicationLoopback.vcxproj -PackagesDirectory native/ApplicationLoopback/packages

      - name: Build per-app audio helper
        run: |
          New-Item -ItemType Directory -Force native/bin
          msbuild native/ApplicationLoopback/ApplicationLoopback.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\native\bin\\"
          if (!(Test-Path native/bin/ApplicationLoopback.exe)) {
            Get-ChildItem native -Recurse -Filter ApplicationLoopback.exe
            throw "ApplicationLoopback.exe was not produced in native/bin"
          }

      - name: Build installer and portable app
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClickFilm-Windows
          path: release/*.exe

      - name: Attach builds to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
