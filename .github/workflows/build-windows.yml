name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore per-app audio helper
        run: nuget restore native/ApplicationLoopback/ApplicationLoopback.vcxproj -PackagesDirectory native/ApplicationLoopback/packages

      - name: Build per-app audio helper
        run: |
          New-Item -ItemType Directory -Force native/bin
          msbuild native/ApplicationLoopback/ApplicationLoopback.vcxproj /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }
          $helper = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter ApplicationLoopback.exe | Select-Object -First 1
          if (!$helper) { throw "MSBuild completed but ApplicationLoopback.exe was not found" }
          Copy-Item $helper.FullName native/bin/ApplicationLoopback.exe -Force
          Write-Host "Packaged audio helper from $($helper.FullName)"

      - name: Build installer and portable app
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path release/win-unpacked/* -DestinationPath release/ClickFilm-Windows-x64.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClickFilm-Windows
          path: |
            release/*.exe
            release/ClickFilm-Windows-x64.zip

      - name: Publish build on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('ClickFilm {0}', github.ref_name) || format('ClickFilm Windows Build #{0}', github.run_number) }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/ClickFilm-Windows-x64.zip
